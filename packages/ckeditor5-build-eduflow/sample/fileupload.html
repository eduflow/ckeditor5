<script src="../build/ckeditor.js"></script>
<script>
	window.CKEDITOR.ClassicEditor.create( document.querySelector( '#editor' ), {
			toolbar: [ 'fileUpload' ],
			image: { toolbar:['linkImage'] },
			fileUpload: {
					downloadLinkRewriter: ( href, el, context ) => {
							// eslint-disable-next-line no-undef
							console.log( 'downloadLinkRewriter, optional callback', href, el, context );
							return `${ href }?addedViaDownloadLinkRewriter`;
					},
					contentWidget: ( div, writer, toWidget, defaultFn ) => {
						// eslint-disable-next-line no-undef
						console.log( 'contentWidget, optional callback', div, writer, toWidget, defaultFn );

						const section = writer.createRawElement( 'section', {
							class: 'product',
							'data-id': '1'
						} );

						writer.insert( writer.createPositionAt( div, 0 ), section );

						return toWidget( div, writer );

						// To have default behavior:
						// return defaultFn();
					}
			}
		})
		.then( editor => {
			window.editor = editor;
		})
		.catch( error => {
			console.error( 'There was a problem initializing the editor.', error );
		} );
</script>
