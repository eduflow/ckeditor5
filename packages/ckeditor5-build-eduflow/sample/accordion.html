<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>CKEditor 5 – balloon block editor build – development sample</title>
	<style>
		body {
			max-width: 800px;
			margin: 20px auto;
			font-family: Arial, Helvetica, sans-serif;
		}

		.ck-accordion {
			padding: 3px;
			margin: 1em 0;
		}

		.ck-accordion-content {
			padding-left: 17px;
		}

		.ck-accordion-title:focus, .ck-accordion-content:focus {
			border: none !important;
			box-shadow: none !important;
		}

		.ck-accordion-title:before {
			margin-left: 17px;
		}
	</style>
</head>
<body>

<h1>CKEditor 5 – balloon block editor build – development sample</h1>

<div id="editor">
	<h2>Accordion example</h2>

	<div class="ck-accordion-wrapper">
	<details class="ck-accordion" data-id="accordion-sample">
		<summary class="ck-accordion-title">Title</summary>
		<div class="ck-accordion-content">Content</div>
	</details>
	</div>

</div>

<script src="../build/ckeditor.js"></script>
<script>
	window.CKEDITOR.ClassicEditor.create( document.querySelector( '#editor' ), { toolbar: [ 'insertAccordion'] } )
		.then( editor => {
			window.editor = editor;
		} )
		.catch( error => {
			console.error( 'There was a problem initializing the editor.', error );
		} );
</script>

</body>
</html>
